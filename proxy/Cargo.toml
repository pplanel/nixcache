[package]
name = "nixcache-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.2"
axum = "0.8.9"
bytes = "1.12.1"
futures-util = "0.3.34"
libc = "0.2.190"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
telemetry = { git = "https://github.com/pplanel/telemetry", rev = "d94083dde17c4ec3362723c4066b219b8f0a5ff9", version = "0.1.0" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
tracing-subscriber = "0.3.23"
